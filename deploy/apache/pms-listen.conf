# ProCentric PMS Middleware - dedizierter Listen-Port (PMS-Interface, PCS -> Middleware)
#
# Wird von der GUI / /usr/local/bin/pms-portctl automatisch verwaltet.
# NUR ueber die GUI bzw. pms-portctl aendern. Der Port muss uebereinstimmen mit
#   - dem VirtualHost-Port in pms-middleware.conf
#   - middleware.pms_interface_port in config.json
#   - dem im PCS eingetragenen Verbindungs-Port
#
# Hinweis: Liegt bewusst NICHT in httpd.conf, damit pms-portctl ihn umschreiben kann,
# ohne den GUI-Port 80 (in httpd.conf) zu beruehren.
Listen 7000
