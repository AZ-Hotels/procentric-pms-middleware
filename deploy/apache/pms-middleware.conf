# ProCentric PMS Middleware - Port 7000
# PCS connects here to reach our PMS interface endpoints

<VirtualHost *:7000>
    DocumentRoot /var/www/html

    # Route all /api/pms/v2/* requests to pms_router.php
    RewriteEngine On
    RewriteCond %{REQUEST_URI} ^/api/pms/v2
    RewriteRule ^/api/pms/v2(.*)$ /pms_router.php [L,QSA]

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /var/log/httpd/pms_error.log
    CustomLog /var/log/httpd/pms_access.log combined
</VirtualHost>
