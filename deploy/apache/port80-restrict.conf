# Web-GUI auf Port 80
# Port 7000 bleibt offen fuer PCS (siehe pms-middleware.conf)
#
# Die IP-Beschraenkung wird jetzt in PHP durchgesetzt (ip_guard.php), gesteuert
# ueber config.json -> access_control.allowed_networks und bearbeitbar im GUI
# (Einstellungen -> Zugriffsbeschraenkung). Daher hier KEINE statischen
# "Require ip"-Regeln mehr, sonst wuerde Apache GUI-Aenderungen ueberstimmen.
#
# Soll Apache zusaetzlich als harte zweite Ebene sperren, koennen die
# "Require ip"-Zeilen wieder ergaenzt werden - dann muessen beide Listen
# konsistent gehalten werden.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
